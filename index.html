<!DOCTYPE html>
<html lang="it" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Utils</title>
  <meta name="description"
    content="Calculate dates and durations directly in your browser. Add or subtract days, count days between two dates." />
  <meta property="og:title" content="Date Utils" />
  <meta property="og:description" content="Add days to a date, or count days between two dates." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#f7f7f4" />
  <script>
    /* Apply saved (or system) language and theme before first paint, so there is no flash */
    (function () {
      var lang, theme;
      try {
        lang = localStorage.getItem('date-utils-language');
        theme = localStorage.getItem('date-utils-theme');
      } catch (_) {}
      if (lang !== 'it' && lang !== 'en') {
        lang = (navigator.language || '').toLowerCase().startsWith('it') ? 'it' : 'en';
      }
      if (theme !== 'dark' && theme !== 'light') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var root = document.documentElement;
      root.lang = lang;
      root.dataset.theme = theme;
      if (theme === 'dark') {
        document.querySelector('meta[name="theme-color"]').content = '#181a1f';
      }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/tailwind.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script defer src="assets/js/alpine.min.js"></script>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png" />
</head>

<body x-data="dateApp()" x-cloak>
  <div class="max-w-lg mx-auto px-4 py-12">
    <div class="mb-8">
      <div class="flex items-center justify-between mb-1">
        <span class="app-title" x-text="t.appName"></span>
        <div class="global-preferences">
          <button type="button" class="pref-btn pref-btn-lang" @click="toggleLang()"
            :title="lang === 'it' ? t.switchToEnglish : t.switchToItalian"
            :aria-label="lang === 'it' ? t.switchToEnglish : t.switchToItalian"
            x-text="lang === 'it' ? 'EN' : 'IT'"></button>
          <button type="button" class="pref-btn" @click="toggleTheme()"
            :title="theme === 'dark' ? t.activateLightTheme : t.activateDarkTheme"
            :aria-label="theme === 'dark' ? t.activateLightTheme : t.activateDarkTheme">
            <svg x-show="theme === 'light'" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg x-show="theme === 'dark'" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="tab-bar flex gap-1 mb-6 p-1 rounded-xl">
      <button @click="switchTab('addDays')" class="tab-btn flex-1 h-9 rounded-lg text-sm font-medium"
        :class="tab === 'addDays' ? 'active' : ''" x-text="t.tabAddDays"></button>
      <button @click="switchTab('countDays')" class="tab-btn flex-1 h-9 rounded-lg text-sm font-medium"
        :class="tab === 'countDays' ? 'active' : ''" x-text="t.tabCountDays"></button>
    </div>
    <div x-show="tab === 'addDays'" x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 translate-x-2" x-transition:enter-end="opacity-100 translate-x-0">
      <p class="text-sm text-muted mb-4" x-text="t.descAddDays"></p>
      <div class="card mb-4">
        <label class="label mb-1.5" x-text="t.labelDate"></label>
        <input type="date" x-model="addDate" class="field" />
        <label class="label mb-1.5 mt-4" x-text="t.labelDays"></label>
        <input type="number" x-model="addDays" min="1" max="9999" placeholder="1 – 9999"
          class="field" />
        <div class="flex gap-4 mt-4">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="radio" x-model="addMode" value="add" class="w-4 h-4" />
            <span class="text-sm" x-text="t.radioAdd"></span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="radio" x-model="addMode" value="subtract" class="w-4 h-4" />
            <span class="text-sm" x-text="t.radioSubtract"></span>
          </label>
        </div>
        <div class="flex gap-2 mt-4">
          <button @click="calculateDate()" class="btn-primary"
            x-text="t.btnCalculate"></button>
          <button @click="clearAll()" class="btn-secondary" x-text="t.btnClear"></button>
        </div>
      </div>
      <div x-show="addError" x-transition class="output-error rounded-xl border px-4 py-3 mb-4">
        <p class="text-sm output-error-text" x-text="addError"></p>
      </div>
      <div x-show="addResult !== null" x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 -translate-y-1" x-transition:enter-end="opacity-100 translate-y-0"
        class="output-success rounded-xl border p-4">
        <p class="text-xs uppercase tracking-widest font-medium output-success-label mb-2" x-text="t.resultDate">
        </p>
        <p class="font-mono text-[18px] font-medium tracking-tight" x-text="addResult"></p>
      </div>
    </div>
    <div x-show="tab === 'countDays'" x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 translate-x-2" x-transition:enter-end="opacity-100 translate-x-0">
      <p class="text-sm text-muted mb-4" x-text="t.descCountDays"></p>
      <div class="card mb-4">
        <label class="label mb-1.5" x-text="t.labelStartDate"></label>
        <input type="date" x-model="startDate" class="field" />
        <label class="label mb-1.5 mt-4" x-text="t.labelEndDate"></label>
        <input type="date" x-model="endDate" class="field" />
        <div class="flex gap-2 mt-4">
          <button @click="calculateDuration()" class="btn-primary"
            x-text="t.btnCalculate"></button>
          <button @click="clearAll()" class="btn-secondary" x-text="t.btnClear"></button>
        </div>
      </div>
      <div x-show="countError" x-transition class="output-error rounded-xl border px-4 py-3 mb-4">
        <p class="text-sm output-error-text" x-text="countError"></p>
      </div>
      <div x-show="countResult !== null" x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 -translate-y-1" x-transition:enter-end="opacity-100 translate-y-0"
        class="output-success rounded-xl border p-4">
        <div class="grid grid-cols-3 gap-3">
          <div class="text-center">
            <p class="text-xs uppercase tracking-widest output-success-label mb-1" x-text="t.resultYears"></p>
            <p class="font-mono text-[24px] font-medium" x-text="countResult?.years"></p>
          </div>
          <div class="text-center border-x output-success-divider">
            <p class="text-xs uppercase tracking-widest output-success-label mb-1" x-text="t.resultMonths"></p>
            <p class="font-mono text-[24px] font-medium" x-text="countResult?.months"></p>
          </div>
          <div class="text-center">
            <p class="text-xs uppercase tracking-widest output-success-label mb-1" x-text="t.resultDays"></p>
            <p class="font-mono text-[24px] font-medium" x-text="countResult?.days"></p>
          </div>
        </div>
      </div>
    </div>
    <footer class="app-footer">
      <span class="text-xs text-subtle" x-text="t.madeWith"></span>
    </footer>
  </div>
  <script src="assets/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/date-utils/sw.js');
    }

    window.addEventListener('load', () => {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
        if (isStandalone) {
            window.resizeTo(750, 650);
        }
    });
  </script>
</body>

</html>
